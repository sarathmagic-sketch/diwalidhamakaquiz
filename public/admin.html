<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diwali Dhamaka Admin</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><main><header><b>🪔 DIWALI DHAMAKA</b><a href="/">HOST SCREEN ↗</a></header><h1>Host control room</h1><section class="panel" id="login"><h2>Host access</h2><input id="pin" type="password" placeholder="Host PIN"><button id="unlock">UNLOCK</button><p id="msg"></p></section><div id="controls" class="hide"><section class="panel"><h2>Game controls</h2><label>Seconds per question <input id="seconds" type="number" value="30"></label><label>Break after question <input id="breakAfter" type="number" value="25"></label><button id="settings">SAVE SETTINGS</button> <button id="start">START / RESTART</button> <button id="next">NEXT / CONTINUE</button> <button id="reset" class="danger">RESET GAME</button><p id="controlmsg"></p></section><section class="panel"><h2>Editable question bank</h2><p>Edit text, options and correct answer. Remove or add questions. Save before starting.</p><button id="add">+ ADD QUESTION</button><div id="list"></div><button id="save">SAVE QUESTION BANK</button><p id="savemsg"></p></section></div></main><script src="/admin.js"></script></body></html>
